name: Stock 250 Dip Alert

on:
  schedule:
    # Every 4 hours (UTC). Translates to 02/06/10/14/18/22 UTC.
    # Paris time: in CET (winter) UTC+1, in CEST (summer) UTC+2.
    # The heartbeat fires whenever the local hour is within 1 of
    # config.heartbeat_hour_local (default 22), at most once per day.
    - cron: "0 */4 * * *"
  workflow_dispatch:  # allow manual trigger from the GitHub UI
    inputs:
      force_heartbeat:
        description: "Force send heartbeat (full status of all stocks down >=10%) regardless of time"
        type: boolean
        default: false

# Prevent two scheduled runs from colliding on state.json commits.
concurrency:
  group: stock-dip-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit state.json back to the repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_HEARTBEAT: ${{ inputs.force_heartbeat }}
        run: python monitor.py

      - name: Commit state.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet state.json 2>/dev/null; then
              git commit -m "Update state $(date -u +%Y-%m-%dT%H:%MZ)"
              git push
            else
              echo "No state changes to commit."
            fi
          else
            echo "state.json not present after run."
          fi
